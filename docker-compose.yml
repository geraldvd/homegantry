# End-user deployment — run HomeGantry with a pre-built image.
# Usage: docker compose up -d
services:
  homegantry:
    image: ghcr.io/geraldvd/homegantry:latest
    container_name: homegantry
    ports:
      - '${HOMEGANTRY_PORT:-3000}:3000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - homegantry_data:/data
    environment:
      - HOMEGANTRY_HOST=${HOMEGANTRY_HOST:-}
      - HOMEGANTRY_TITLE=${HOMEGANTRY_TITLE:-HomeGantry}
    restart: unless-stopped
    labels:
      - homegantry.hidden=true

volumes:
  homegantry_data:
