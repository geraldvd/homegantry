name: Missing service
description: A service HomeGantry should recognise automatically
labels: [enhancement, good first issue]
body:
  - type: markdown
    attributes:
      value: |
        HomeGantry recognises containers through one small YAML file per service in `knowledge-base/`. Pull requests are very welcome, see "Add a service to the knowledge base" in the docs. Please use only public image names, and no hostnames or addresses from your own lab.
  - type: input
    id: name
    attributes:
      label: Service name
      placeholder: Jellyfin
    validations:
      required: true
  - type: textarea
    id: images
    attributes:
      label: Image name
      description: Public image repositories people commonly use (one per line, without tag).
      placeholder: |
        jellyfin/jellyfin
        lscr.io/linuxserver/jellyfin
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Homepage
      description: Project website or repository.
      placeholder: https://example.com
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: Icon
      description: Slug from [dashboard-icons](https://github.com/homarr-labs/dashboard-icons), if there is one.
      placeholder: jellyfin
    validations:
      required: true
  - type: input
    id: aliases
    attributes:
      label: Common compose service / container names
      placeholder: jellyfin
  - type: input
    id: category
    attributes:
      label: Category
      placeholder: Media
  - type: input
    id: port
    attributes:
      label: Default web UI port
      placeholder: '8096'
  - type: checkboxes
    id: infra
    attributes:
      label: Infrastructure
      options:
        - label: This is a background/infrastructure service (database, cache, proxy) that should be hidden by default
