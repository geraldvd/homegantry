name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check docs/MISSION.md first: HomeGantry observes and never controls containers, and aims to work with zero configuration.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How could HomeGantry solve this? Labels, settings, UI?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
