# HomeGantry behind a read-only Docker socket proxy (recommended).
#
# HomeGantry never mounts the Docker socket itself. It talks to the socket proxy over a private
# network, and the proxy only allows the read-only endpoints HomeGantry uses:
#   GET /containers/json  (CONTAINERS=1)   and   GET /events  (EVENTS=1)
# Everything else (POST, exec, images, volumes, ...) is refused by the proxy.
#
# Usage:
#   cp examples/compose.socket-proxy.yaml compose.yaml
#   echo "HOMEGANTRY_ADMIN_TOKEN=$(openssl rand -hex 32)" > .env   # optional: enables editing
#   docker compose up -d
#
# See docs/guide/security.md for the full security model.
services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1 # list containers (read-only)
      EVENTS: 1 # real-time container events (read-only)
      # Everything else off, explicitly:
      POST: 0
      PING: 0
      VERSION: 0
      INFO: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      SECRETS: 0
      CONFIGS: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      AUTH: 0
      PLUGINS: 0
      SWARM: 0
      SYSTEM: 0
      DISTRIBUTION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    labels:
      - homegantry.exclude=true

  homegantry:
    image: ghcr.io/geraldvd/homegantry:latest
    restart: unless-stopped
    depends_on:
      - socket-proxy
    ports:
      - '3000:3000'
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      HOMEGANTRY_HOST: ${HOMEGANTRY_HOST:-192.168.1.100}
      # Optional: enable editing with a token (at least 24 characters). Leave empty for read-only.
      HOMEGANTRY_ADMIN_TOKEN: ${HOMEGANTRY_ADMIN_TOKEN:-}
    volumes:
      - homegantry_data:/data
    networks:
      - docker-api
      - default

volumes:
  homegantry_data:

networks:
  # Internal network: the socket proxy is reachable only from HomeGantry, never from outside.
  docker-api:
    internal: true
